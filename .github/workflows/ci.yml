name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22.16.0, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Configure git identity (repo-creating tests commit)
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@example.invalid"
          git config --global init.defaultBranch main
      - run: npm ci
      - run: npm test
        env:
          AGENT_COORD_NOTIFY: "0"
      - name: Smoke test a source archive without checkout metadata
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        shell: bash
        run: |
          archive_dir="$(mktemp -d)"
          git archive --format=tar HEAD | tar -x -C "$archive_dir"
          cd "$archive_dir"
          npm ci --no-audit --no-fund
          node --disable-warning=ExperimentalWarning test/run-all.mjs mcp-smoke codex-hooks
